name: Update EPG
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate epg.xml
        run: |
          python3 - <<'PY'
          from datetime import datetime, timedelta, timezone
          DAYS = 365
          fmt = "%Y%m%d%H%M%S"
          start = (datetime.now(timezone.utc) - timedelta(days=1)).replace(hour=0, minute=0, second=0, microsecond=0)
          out = [
              '<?xml version="1.0" encoding="UTF-8"?>',
              '<tv generator-info-name="custom">',
              '<channel id="NBCNewYorkNews"><display-name>NBC New York News</display-name></channel>',
          ]
          for i in range((DAYS + 1) * 24):
              s = start + timedelta(hours=i)
              e = s + timedelta(hours=1)
              out.append(f'<programme start="{s.strftime(fmt)} +0000" stop="{e.strftime(fmt)} +0000" channel="NBCNewYorkNews"><title lang="en">NBC New York News</title><desc lang="en">NBC New York News</desc></programme>')
          out.append('</tv>')
          open("epg.xml", "w").write("\n".join(out) + "\n")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add epg.xml
          git diff --staged --quiet || git commit -m "Update EPG"
          git push
